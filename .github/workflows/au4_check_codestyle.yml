name: '[AU4] Check: Codestyle'

on:
  pull_request:
  workflow_dispatch:

jobs:
  au4_codestyle:    
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Fetch Muse CI scripts
      run: |
        git clone https://github.com/musescore/muse_framework.git ./muse

    - name: Test coding style
      run: |
        cmake -P ./muse/buildscripts/ci/checkcodestyle/checkcodestyle.cmake ./src/
